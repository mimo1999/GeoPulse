version: "3.9"

services:
  postgres:
    image: timescale/timescaledb-ha:pg15-latest
    container_name: geopulse_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gldt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gldt_secret}
      POSTGRES_DB: ${POSTGRES_DB:-gdelt_risk}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/home/postgres/pgdata/data
      - ./init.sql:/docker-entrypoint-initdb.d/01_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gldt} -d ${POSTGRES_DB:-gdelt_risk}"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      postgres
        -c shared_buffers=512MB
        -c effective_cache_size=2GB
        -c work_mem=64MB
        -c maintenance_work_mem=256MB
        -c max_connections=100
        -c checkpoint_completion_target=0.9
        -c wal_buffers=16MB
        -c default_statistics_target=100

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: geopulse_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-gldt}:${POSTGRES_PASSWORD:-gldt_secret}@postgres:5432/${POSTGRES_DB:-gdelt_risk}
      DATABASE_SYNC_URL: postgresql://${POSTGRES_USER:-gldt}:${POSTGRES_PASSWORD:-gldt_secret}@postgres:5432/${POSTGRES_DB:-gdelt_risk}
      OLLAMA_URL: http://ollama:11434
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    volumes:
      - ../:/app
      - model_cache:/app/models/checkpoints
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload

  streamlit:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: geopulse_streamlit
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "8501:8501"
    volumes:
      - ../:/app
    command: streamlit run streamlit_app/app.py --server.port 8501 --server.address 0.0.0.0

  ollama:
    image: ollama/ollama:latest
    container_name: geopulse_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  neo4j:
    image: neo4j:5-community
    container_name: geopulse_neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-geopulse_neo4j_dev}
      # Community edition ships one DB per instance; named for parity with
      # the eventual prod graph, not because multi-db is available here.
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"   # HTTP -- Neo4j Browser
      - "7687:7687"   # Bolt -- driver connections (Python neo4j package, cypher-shell)
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  scheduler:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: geopulse_scheduler
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_SYNC_URL: postgresql://${POSTGRES_USER:-gldt}:${POSTGRES_PASSWORD:-gldt_secret}@postgres:5432/${POSTGRES_DB:-gdelt_risk}
    volumes:
      - ../:/app
      - gdelt_downloads:/app/data/raw
    command: python -m ingestion.scheduler

volumes:
  postgres_data:
  model_cache:
  ollama_models:
  gdelt_downloads:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
